{% extends "layout.html" %}
{% block content %}
<div class="glass-panel" style="max-width: 400px; margin: 0 auto;">
    <h2>Zaloguj się</h2>
    <form action="/login" method="POST">
        <div class="form-group">
            <label for="username">Nazwa użytkownika</label>
            <input type="text" id="username" name="username" placeholder="Wprowadź login" required>
        </div>
        <div class="form-group">
            <label for="password">Hasło</label>
            <input type="password" id="password" name="password" placeholder="Wprowadź hasło" required>
        </div>
        <button type="submit">Zaloguj się</button>
    </form>
    <div style="margin-top: 1.5rem; text-align: center; font-size: 0.875rem;">
        Nie masz konta? <a href="/register" style="color: var(--primary); font-weight: 600; text-decoration: none;">Zarejestruj się</a>
    </div>
</div>
{% endblock %}
