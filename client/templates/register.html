{% extends "layout.html" %}
{% block content %}
<div class="glass-panel" style="max-width: 400px; margin: 0 auto;">
    <h2>Zarejestruj się</h2>
    <form action="/register" method="POST">
        <div class="form-group">
            <label for="username">Nazwa użytkownika</label>
            <input type="text" id="username" name="username" placeholder="Wybierz login" required>
        </div>
        <div class="form-group">
            <label for="password">Hasło</label>
            <input type="password" id="password" name="password" placeholder="Wybierz hasło" required>
        </div>
        <button type="submit">Zarejestruj się</button>
    </form>
    <div style="margin-top: 1.5rem; text-align: center; font-size: 0.875rem;">
        Masz już konto? <a href="/login" style="color: var(--primary); font-weight: 600; text-decoration: none;">Zaloguj się</a>
    </div>
</div>
{% block content_footer %}
{% endblock %}
{% endblock %}
